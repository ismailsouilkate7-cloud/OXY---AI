<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OXY AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════
       IMAGE MODAL (full-size preview)
  ═══════════════════════════════════════════ -->
  <div id="imageModal" class="image-modal" role="dialog" aria-modal="true" aria-label="Image preview">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <img id="modalImage" src="" alt="Full size preview" />
      <div class="modal-actions">
        <button class="modal-action-btn" id="modalDownload" title="Download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
        <button class="modal-action-btn" id="modalCopy" title="Copy image">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <button class="modal-action-btn" id="modalOpen" title="Open in new tab">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Open
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SIDEBAR OVERLAY (mobile)
  ═══════════════════════════════════════════ -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- ═══════════════════════════════════════════
       CONTEXT MENU (rename/delete)
  ═══════════════════════════════════════════ -->
  <div id="conversationContextMenu" class="context-menu" style="display:none;">
    <button class="context-menu-item" id="renameConversationBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Rename
    </button>
    <button class="context-menu-item danger" id="deleteConversationBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Delete
    </button>
  </div>

  <!-- ═══════════════════════════════════════════
       MAIN APP
  ═══════════════════════════════════════════ -->
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="/fox-logo.svg" alt="OXY AI" class="logo-icon-img" />
          <span class="logo-text">OXY AI</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Chat
        </button>
      </nav>

      <!-- Conversation History -->
      <div class="sidebar-section conversation-list-section">
        <p class="sidebar-label">Chat History</p>
        <div class="conversation-list" id="conversationList">
          <!-- Conversation items rendered here by JS -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="model-badge">
          <span class="model-dot"></span>
          OXY AI
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main" id="chatMain">

      <!-- Top bar -->
      <header class="chat-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="chat-title" id="chatTitle">OXY AI</span>
        <div class="header-spacer"></div>
      </header>

      <!-- Messages -->
      <div class="chat-messages" id="chat">
        <!-- Welcome screen -->
        <div class="welcome-screen" id="welcomeScreen">
          <img src="/fox-logo.svg" alt="SOUILX" class="welcome-logo-img" />
          <h1 class="welcome-title">How can I help you today?</h1>
          <p class="welcome-subtitle">Chat, analyze images, or edit them with AI</p>
          <div class="welcome-suggestions">
            <button class="suggestion-chip" data-msg="Salam">👋 Salam OXY!</button>
            <button class="suggestion-chip" data-msg="Analyze the image I upload">🖼️ Analyze an image</button>
            <button class="suggestion-chip" data-msg="Write me a Python function to sort a list">💻 Write some code</button>
            <button class="suggestion-chip" data-msg="Explain machine learning in simple terms">🤖 Explain AI</button>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area" id="inputArea">

        <!-- Image preview above input -->
        <div class="input-image-preview" id="inputImagePreview" style="display:none;">
          <div class="preview-image-wrapper">
            <img id="previewThumb" src="" alt="Selected image" />
            <button class="preview-remove-btn" id="previewRemoveBtn" aria-label="Remove image">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="preview-image-info">
            <span id="previewFileName" class="preview-filename"></span>
            <span id="previewFileSize" class="preview-filesize"></span>
          </div>
        </div>

        <!-- Drag overlay -->
        <div class="drag-overlay" id="dragOverlay">
          <div class="drag-overlay-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <p>Drop image here</p>
          </div>
        </div>

        <!-- Input box -->
        <div class="input-box" id="inputBox">
          <!-- Image upload button -->
          <button class="input-icon-btn" id="attachBtn" title="Attach image" aria-label="Attach image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>

          <!-- Hidden file input -->
          <input id="fileInput" type="file" accept=".png,.jpg,.jpeg,.webp" style="display:none;" aria-label="Upload image">

          <!-- Text input -->
          <textarea
            id="msg"
            class="chat-input"
            placeholder="Message OXY AI..."
            rows="1"
            aria-label="Message input"
          ></textarea>

          <!-- Send button -->
          <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>

        <!-- Edit Controls -->
        <div class="edit-controls" id="editControls" style="display:none;">
          <button class="cancel-edit-btn" id="cancelEditBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Cancel
          </button>
          <button class="save-edit-btn" id="saveEditBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save & Regenerate
          </button>
        </div>

        <p class="input-disclaimer">OXY AI can make mistakes. Powered by Ismail Souilkate.</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
